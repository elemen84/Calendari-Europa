name: Sync CE Europa calendar

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Força el sync encara que no hagin passat 24 hores"
        required: false
        default: true
        type: boolean
  push:
    paths:
      - "public/index.html"
      - "public/styles.css"
      - "public/app.js"
      - "public/favicon.svg"
      - "public/assets/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Tests before sync
        run: python -m pytest
      - name: Sync official RFEF source
        env:
          EUROPA_SEASON_START_YEAR: "2026"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ inputs.force }}" = "true" ]; then
            python scripts/sync_calendar.py --force
          else
            python scripts/sync_calendar.py
          fi
      - name: Commit generated data when changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/europa.ics data/sync-state.json data/provider-cache
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update CE Europa calendar data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-after-sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  deploy-frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
